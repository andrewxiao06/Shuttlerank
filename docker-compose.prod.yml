# Production stack for EC2: Postgres + Redis + FastAPI + Caddy (TLS).
#
# This is a STANDALONE compose file (not an overlay on docker-compose.yml) so
# none of the dev conveniences — source bind-mount, --reload, the
# CLERK_DEV_ALLOW_HEADER bypass — can ever leak into production.
#
# Run:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Logs: docker compose -f docker-compose.prod.yml logs -f api
#
# The frontend is NOT here — it deploys to Vercel. Caddy fronts only the API.

services:
  # Postgres is hosted on Neon (managed, backed up) — see DATABASE_URL in
  # .env.prod. No local db container. Migrated off the on-box volume 2026-07.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No published port — internal only.

  api:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      # DATABASE_URL comes from .env.prod (Neon). REDIS_URL is the internal
      # service address.
      DATABASE_URL: ${DATABASE_URL:?set in .env.prod — Neon asyncpg URL}
      REDIS_URL: redis://redis:6379/0
      # NOTE: no UVICORN_EXTRA_ARGS (no --reload) and no CLERK_DEV_ALLOW_HEADER.
    expose:
      - "8000"          # reachable by Caddy on the internal network only
    depends_on:
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # persisted TLS certs — DO NOT delete casually
      - caddy_config:/config
    environment:
      API_DOMAIN: ${API_DOMAIN:?set in .env.prod, e.g. api.yourdomain.com}
    depends_on:
      - api

volumes:
  # pgdata retired — database now lives on Neon. The old on-box volume can be
  # removed once the Neon cutover is confirmed (docker volume rm dubr_pgdata).
  caddy_data:
  caddy_config:
